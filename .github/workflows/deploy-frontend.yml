name: Frontend Deploy

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 설정 파일 생성
        run: |
          mkdir -p frontend
          echo "${{secrets.FRONTEND_SECRET}}" > frontend/.env

      - name: 의존성 설치
        run: |
          cd frontend
          npm ci

      - name: npm 빌드
        run: |
          cd frontend
          npm run build

      - name: 빌드 결과물 압축
        id: build
        run: |
          BUILD_NAME="frontend-$(date +%Y%m%d-%H%M%S)"
          cd frontend
          tar -czf $BUILD_NAME.tar.gz dist/
          echo "name=$BUILD_NAME" >> $GITHUB_OUTPUT
          echo "archive=$BUILD_NAME.tar.gz" >> $GITHUB_OUTPUT
          echo "압축 파일: $BUILD_NAME.tar.gz"

      - name: SSH 키 설정
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.FRONTEND_SERVER_IP }} >> ~/.ssh/known_hosts

      - name: 빌드 파일 업로드
        run: |
          scp -i ~/.ssh/id_rsa \
            frontend/${{ steps.build.outputs.archive }} \
            ubuntu@${{ secrets.FRONTEND_SERVER_IP }}:/home/ubuntu/frontend-builds/

      - name: 무중단 배포 실행
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.FRONTEND_SERVER_IP }} bash << 'ENDSSH'

          BUILD_ARCHIVE="/home/ubuntu/frontend-builds/${{ steps.build.outputs.archive }}"
          BUILD_NAME="${{ steps.build.outputs.name }}"

          # 현재 활성 디렉토리 확인
          if [ -f /home/ubuntu/current-frontend ]; then
              CURRENT_DIR=$(cat /home/ubuntu/current-frontend)
          else
              CURRENT_DIR="blue"
          fi

          # 새 디렉토리 결정 (Blue-Green)
          if [ "$CURRENT_DIR" = "blue" ]; then
              NEW_DIR="green"
          else
              NEW_DIR="blue"
          fi

          echo "현재: $CURRENT_DIR → 새 배포: $NEW_DIR"

          # 새 디렉토리에 압축 해제
          NEW_PATH="/var/www/react-app-$NEW_DIR"
          sudo mkdir -p $NEW_PATH
          sudo tar -xzf $BUILD_ARCHIVE -C $NEW_PATH --strip-components=1

          # 권한 설정
          sudo chown -R www-data:www-data $NEW_PATH
          sudo chmod -R 755 $NEW_PATH

          # Nginx 설정 변경 (심볼릭 링크 방식)

          sudo rm -f /var/www/react-app
          sudo ln -sf $NEW_PATH /var/www/react-app

          # Nginx 설정 테스트 및 리로드
          if sudo nginx -t 2>/dev/null; then
              sudo nginx -s reload
              echo "Nginx 전환 완료"
          else
              echo "Nginx 설정 오류"
              # 롤백
              sudo rm -f /var/www/react-app
              sudo ln -sf /var/www/react-app-$CURRENT_DIR /var/www/react-app
              exit 1
          fi

          # 헬스체크 (간단한 HTTP 체크)
          HEALTH_CHECK_PASSED=false
          for i in {1..10}; do
              if curl -f http://localhost > /dev/null 2>&1; then
                  echo "프론트엔드 정상 작동 (${i}초 소요)"
                  HEALTH_CHECK_PASSED=true
                  break
              fi
              sleep 1
          done

          if [ "$HEALTH_CHECK_PASSED" = false ]; then
              echo "헬스체크 실패! 롤백시작"
              sudo rm -f /var/www/react-app
              sudo ln -sf /var/www/react-app-$CURRENT_DIR /var/www/react-app
              sudo nginx -s reload
              exit 1
          fi

          # 이전 디렉토리 정리
          # sudo rm -rf /var/www/react-app-$CURRENT_DIR/*

          # 현재 활성 정보 저장
          echo $NEW_DIR > /home/ubuntu/current-frontend

          # 오래된 빌드 파일 정리 (최신 5개만 유지)
          cd /home/ubuntu/frontend-builds
          ls -t frontend-*.tar.gz 2>/dev/null | tail -n +6 | xargs -r rm -f
          REMAINING=$(ls -1 frontend-*.tar.gz 2>/dev/null | wc -l)
          echo "정리 완료 (현재 $REMAINING개 빌드 파일 보관)"

          echo ""
          echo "프론트엔드 배포 완료, 활성 디렉토리: $NEW_DIR"

          ENDSSH
