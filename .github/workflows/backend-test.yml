name: Backend Test

# 필수 상태 체크로 쓰므로 paths 필터를 걸지 않는다. 걸면 프론트만 바꾼 PR에서 체크가 생기지 않아 머지가 막힌다
on:
  pull_request:
    branches:
      - main

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: newslit_test
        # application-test.properties와 같은 포트를 써서 로컬과 CI가 설정 파일 하나를 공유한다
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: 테스트
        working-directory: backend
        run: ./gradlew test
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
