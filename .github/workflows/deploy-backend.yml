name: Backend Deploy

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: 설정 파일 생성
        run: |
          mkdir -p backend/src/main/resources
          printf '%s' "$APP_SECRET" > backend/src/main/resources/application-prod-secret.properties
        env:
          APP_SECRET: ${{ secrets.APPLICATION_PROD_SECRET }}

      - name: Gradle 빌드
        run: |
          cd backend
          chmod +x gradlew
          ./gradlew clean build -x test -Dspring.profiles.active=prod-secret
        env:
          SPRING_PROFILES_ACTIVE: prod-secret

      - name: JAR 파일명 생성
        id: jar
        run: |
          JAR_NAME="backend-$(date +%Y%m%d-%H%M%S).jar"
          echo "name=$JAR_NAME" >> $GITHUB_OUTPUT
          echo "path=backend/build/libs/backend-0.0.1-SNAPSHOT.jar" >> $GITHUB_OUTPUT

      - name: SSH 키 설정
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.BACKEND_SERVER_IP }} >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config << EOF
          Host *
            ServerAliveInterval 15
            ServerAliveCountMax 20
          EOF

      - name: JAR 파일 업로드
        run: |
          scp -i ~/.ssh/id_rsa \
            ${{ steps.jar.outputs.path }} \
            ubuntu@${{ secrets.BACKEND_SERVER_IP }}:/home/ubuntu/jars/${{ steps.jar.outputs.name }}

      - name: 롤링 배포 실행
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.BACKEND_SERVER_IP }} bash << 'ENDSSH'

          # 현재 심볼릭 링크 백업 (롤백용)
          PREVIOUS_JAR=$(readlink /home/ubuntu/current-8080.jar 2>/dev/null || echo "")
          echo "이전 JAR: $PREVIOUS_JAR"

          # 최신 jar 파일 찾기
          LATEST_JAR=$(ls -t /home/ubuntu/jars/backend-*.jar 2>/dev/null | head -1)
          if [ -z "$LATEST_JAR" ]; then
              echo "배포할 JAR 파일이 없습니다. 배포 중단."
              exit 1
          fi
          echo "배포할 JAR: $LATEST_JAR"

          # 심볼릭 링크 갱신
          ln -sf $LATEST_JAR /home/ubuntu/current-8080.jar

          # 기존 로그를 JAR 이름으로 보관
          JAR_TIMESTAMP=$(basename $LATEST_JAR .jar | sed 's/backend-//')
          if [ -f /home/ubuntu/logs/app-8080.log ]; then
              mv /home/ubuntu/logs/app-8080.log /home/ubuntu/logs/app-8080-${JAR_TIMESTAMP}.log
          fi

          # 오래된 로그 파일 정리 (최신 5개만 유지, FAILED 로그 제외)
          ls -t /home/ubuntu/logs/app-8080-*.log 2>/dev/null | grep -v 'FAILED' | tail -n +6 | xargs -r rm -f
          # FAILED 로그 정리 (최신 5개만 유지)
          ls -t /home/ubuntu/logs/app-8080-FAILED-[0-9]*.log 2>/dev/null | tail -n +6 | xargs -r rm -f
          ls -t /home/ubuntu/logs/app-8080-FAILED-JOURNAL-*.log 2>/dev/null | tail -n +6 | xargs -r rm -f

          # 서비스 재시작
          echo "서비스 재시작 중..."
          sudo systemctl restart newslit@8080

          # 헬스체크 (최대 200초)
          echo "헬스체크 시작..."
          HEALTH_OK=false
          for i in $(seq 1 400); do
              if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
                  echo "구동 성공 (${i}초 소요)"
                  HEALTH_OK=true
                  break
              fi
              echo -n "."
              sleep 1
          done

          if [ "$HEALTH_OK" = false ]; then
              echo ""
              echo "헬스체크 실패. 롤백 시작..."

              FAIL_LOG="/home/ubuntu/logs/app-8080-FAILED-${JAR_TIMESTAMP}.log"
              JOURNAL_LOG="/home/ubuntu/logs/app-8080-FAILED-JOURNAL-${JAR_TIMESTAMP}.log"

              # app 로그 저장
              cp /home/ubuntu/logs/app-8080.log "$FAIL_LOG" 2>/dev/null || true

              # journalctl 로그 별도 저장
              journalctl -u newslit@8080 -n 300 --no-pager > "$JOURNAL_LOG" 2>/dev/null || true

              # GitHub Actions 출력
              echo "=== APP LOG ==="
              tail -50 /home/ubuntu/logs/app-8080.log
              echo "=== JOURNALCTL ==="
              journalctl -u newslit@8080 -n 300 --no-pager

              if [ -n "$PREVIOUS_JAR" ] && [ -f "$PREVIOUS_JAR" ]; then
                  ln -sf $PREVIOUS_JAR /home/ubuntu/current-8080.jar
                  sudo systemctl restart newslit@8080
                  echo "롤백 완료: $PREVIOUS_JAR"
              else
                  echo "롤백할 이전 JAR 없음"
              fi

              exit 1
          fi

          # 오래된 jar 파일 정리 (최신 5개만 유지)
          cd /home/ubuntu/jars
          ls -t backend-*.jar | tail -n +6 | xargs -r rm -f
          REMAINING=$(ls -1 backend-*.jar 2>/dev/null | wc -l)
          echo "정리 완료 (현재 $REMAINING개 jar 보관)"

          echo "배포 완료"

          ENDSSH

      - name: 최종 헬스체크
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.BACKEND_SERVER_IP }} bash << 'ENDSSH'
          if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "최종 헬스체크 성공!"
          else
              echo "최종 헬스체크 실패"
              exit 1
          fi
          ENDSSH
