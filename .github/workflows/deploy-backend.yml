name: Backend Deploy

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: 설정 파일 생성
        run: |
          mkdir -p backend/src/main/resources
          echo "${{secrets.APPLICATION_PROD_SECRET}}" > backend/src/main/resources/application-prod-secret.properties

      - name: Gradle 빌드
        run: |
          cd backend
          chmod +x gradlew
          ./gradlew clean build -x test -Dspring.profiles.active=prod-secret
        env:
          SPRING_PROFILES_ACTIVE: prod-secret

      - name: JAR 파일명 생성
        id: jar
        run: |
          JAR_NAME="backend-$(date +%Y%m%d-%H%M%S).jar"
          echo "name=$JAR_NAME" >> $GITHUB_OUTPUT
          echo "path=backend/build/libs/backend-0.0.1-SNAPSHOT.jar" >> $GITHUB_OUTPUT

      - name: SSH 키 설정
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.BACKEND_SERVER_IP }} >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config << EOF
          Host *
            ServerAliveInterval 15
            ServerAliveCountMax 20
          EOF

      - name: JAR 파일 업로드
        run: |
          scp -i ~/.ssh/id_rsa \
            ${{ steps.jar.outputs.path }} \
            ubuntu@${{ secrets.BACKEND_SERVER_IP }}:/home/ubuntu/jars/${{ steps.jar.outputs.name }}

      - name: 롤링 배포 실행
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.BACKEND_SERVER_IP }} bash << 'ENDSSH'

          # 현재 실행 중인 jar 백업 (롤백용)
          PREVIOUS_JAR=$(readlink /home/ubuntu/current.jar 2>/dev/null || echo "")
          echo "이전 JAR: $PREVIOUS_JAR"

          # 최신 jar 파일 찾기
          LATEST_JAR=$(ls -t /home/ubuntu/jars/backend-*.jar 2>/dev/null | head -1)
          if [ -z "$LATEST_JAR" ]; then
              echo "배포할 JAR 파일이 없습니다. 배포 중단."
              exit 1
          fi
          echo "배포할 JAR: $LATEST_JAR"

          # 기존 프로세스 PID 확인 (PID 파일 우선, fallback으로 포트 점유 프로세스)
          OLD_PID=""
          if [ -f /home/ubuntu/app.pid ]; then
              OLD_PID=$(cat /home/ubuntu/app.pid | tr -d '[:space:]')
              if ! kill -0 "$OLD_PID" 2>/dev/null; then
                  echo "PID 파일의 프로세스($OLD_PID)가 이미 없음. 포트로 재탐색..."
                  OLD_PID=$(lsof -ti:8080 2>/dev/null | head -1 || echo "")
              fi
          else
              OLD_PID=$(lsof -ti:8080 2>/dev/null | head -1 || echo "")
          fi
          echo "기존 PID: ${OLD_PID:-없음}"

          # 기존 프로세스 먼저 종료 (포트 해제 후 새 앱 시작)
          if [ -n "$OLD_PID" ]; then
              echo "기존 프로세스 종료 (PID: $OLD_PID)..."
              kill "$OLD_PID" 2>/dev/null || true
              # SIGTERM 후 최대 15초 대기
              for i in $(seq 1 15); do
                  if ! kill -0 "$OLD_PID" 2>/dev/null; then
                      echo "기존 프로세스 종료 완료 (${i}초 소요)"
                      break
                  fi
                  sleep 1
              done
              # 여전히 살아있으면 SIGKILL
              if kill -0 "$OLD_PID" 2>/dev/null; then
                  echo "강제 종료(SIGKILL) 적용..."
                  kill -9 "$OLD_PID" 2>/dev/null || true
                  sleep 1
              fi
          fi

          # 심볼릭 링크 갱신
          ln -sf $LATEST_JAR /home/ubuntu/current.jar

          # 새 애플리케이션 시작
          echo "새 애플리케이션 시작 중..."
          nohup java -jar /home/ubuntu/current.jar \
            --spring.profiles.active=prod-secret \
            --spring.config.additional-location=file:/home/ubuntu/ \
            --server.port=8080 \
            > /home/ubuntu/logs/app.log 2>&1 &
          NEW_PID=$!
          echo "$NEW_PID" > /home/ubuntu/app.pid
          echo "새 PID: $NEW_PID"

          # 헬스체크 (최대 150초)
          echo "헬스체크 시작..."
          HEALTH_OK=false
          for i in $(seq 1 150); do
              if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
                  echo "구동 성공 (${i}초 소요)"
                  HEALTH_OK=true
                  break
              fi
              echo -n "."
              sleep 1
          done

          if [ "$HEALTH_OK" = false ]; then
              echo ""
              echo "헬스체크 실패. 롤백 시작..."

              # 새 프로세스 종료
              kill "$NEW_PID" 2>/dev/null || true

              # 실패 로그 먼저 출력 (롤백 앱 시작 전에 캡처)
              echo "=== 실패 로그 (마지막 30줄) ==="
              tail -30 /home/ubuntu/logs/app.log

              # 이전 jar로 롤백
              if [ -n "$PREVIOUS_JAR" ] && [ -f "$PREVIOUS_JAR" ]; then
                  ln -sf $PREVIOUS_JAR /home/ubuntu/current.jar
                  nohup java -jar /home/ubuntu/current.jar \
                    --spring.profiles.active=prod-secret \
                    --spring.config.additional-location=file:/home/ubuntu/ \
                    --server.port=8080 \
                    >> /home/ubuntu/logs/app.log 2>&1 &
                  ROLLBACK_PID=$!
                  echo "$ROLLBACK_PID" > /home/ubuntu/app.pid
                  echo "롤백 완료: $PREVIOUS_JAR (PID: $ROLLBACK_PID)"
              else
                  echo "롤백할 이전 JAR 없음"
                  rm -f /home/ubuntu/app.pid
              fi

              exit 1
          fi

          # 오래된 jar 파일 정리 (최신 5개만 유지)
          cd /home/ubuntu/jars
          ls -t backend-*.jar | tail -n +6 | xargs -r rm -f
          REMAINING=$(ls -1 backend-*.jar 2>/dev/null | wc -l)
          echo "정리 완료 (현재 $REMAINING개 jar 보관)"

          echo "배포 완료"

          ENDSSH

      - name: 최종 헬스체크
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.BACKEND_SERVER_IP }} bash << 'ENDSSH'
          if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "최종 헬스체크 성공!"
          else
              echo "최종 헬스체크 실패"
              exit 1
          fi
          ENDSSH