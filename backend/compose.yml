services:
  oracle:
    image: gvenzl/oracle-free:23.26.3-slim
    ports:
      - "127.0.0.1:1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_ADMIN_PASSWORD:-newslit-local-admin}
      APP_USER: ${ORACLE_LOCAL_USERNAME:-newslit}
      APP_USER_PASSWORD: ${ORACLE_LOCAL_PASSWORD:-newslit-local}
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 2m
    volumes:
      - oracle-data:/opt/oracle/oradata
    restart: unless-stopped

volumes:
  oracle-data:
