spring.application.name=newslit
spring.profiles.include=secret
springdoc.default-consumes-media-type=application/json;charset=UTF-8
springdoc.default-produces-media-type=application/json;charset=UTF-8
springdoc.swagger-ui.path=/
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.operations-sorter=alpha
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
#spring.profiles.active=local,local-secret
spring.profiles.active=prod-secret
# Actuator ??
management.endpoints.web.exposure.include=health,info
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=always
# Cache Configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=24h
jwt.expiration=3600000
# Mail Configuration
mail.verify-sender=noreply@newslit.net