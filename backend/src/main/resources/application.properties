spring.application.name=newslit
spring.profiles.include=secret
server.forward-headers-strategy=framework
springdoc.default-consumes-media-type=application/json;charset=UTF-8
springdoc.default-produces-media-type=application/json;charset=UTF-8
springdoc.swagger-ui.path=/
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.operations-sorter=alpha
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
spring.profiles.active=local-secret,local
#spring.profiles.active=prod-secret
# Actuator ??
management.endpoints.web.exposure.include=health,info
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=always
# Cache Configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=24h
jwt.auth.expiration=3600000
jwt.verify.expiration=600000
# OpenAI TTS (api-key는 openai.api-key 공용)
openai.tts.url=https://api.openai.com/v1/audio/speech
openai.tts.model=gpt-4o-mini-tts
openai.tts.voice=alloy
# Sentence Split Pipeline
pipeline.sentence-split.batch-size=${SENTENCE_SPLIT_BATCH_SIZE:5}
pipeline.sentence-split.max-retry-count=${SENTENCE_SPLIT_MAX_RETRY_COUNT:3}
pipeline.sentence-split.fixed-delay-ms=${SENTENCE_SPLIT_FIXED_DELAY_MS:300000}
pipeline.sentence-split.stale-processing-minutes=${SENTENCE_SPLIT_STALE_PROCESSING_MINUTES:10}
# Translation Pipeline
pipeline.translation.batch-size=${TRANSLATION_BATCH_SIZE:20}
pipeline.translation.max-retry-count=${TRANSLATION_MAX_RETRY_COUNT:10}
pipeline.translation.fixed-delay-ms=${TRANSLATION_FIXED_DELAY_MS:300000}
pipeline.translation.stale-processing-minutes=${TRANSLATION_STALE_PROCESSING_MINUTES:10}
# Daily Pipeline
pipeline.daily.batch-size=${DAILY_BATCH_SIZE:5}
pipeline.daily.max-retry-count=${DAILY_MAX_RETRY_COUNT:3}
pipeline.daily.fixed-delay-ms=${DAILY_FIXED_DELAY_MS:300000}
pipeline.daily.stale-processing-minutes=${DAILY_STALE_PROCESSING_MINUTES:10}
# TTS Pipeline
pipeline.tts.batch-size=${TTS_BATCH_SIZE:10}
pipeline.tts.max-retry-count=${TTS_MAX_RETRY_COUNT:3}
pipeline.tts.fixed-delay-ms=${TTS_FIXED_DELAY_MS:300000}
pipeline.tts.stale-processing-minutes=${TTS_STALE_PROCESSING_MINUTES:10}
# Mail Configuration
mail.verify-sender=noreply@newslit.net
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration,org.springframework.boot.autoconfigure.mail.MailSenderValidatorAutoConfiguration
