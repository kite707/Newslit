# 테스트 DB: Testcontainers가 테스트 실행 시 MySQL 컨테이너를 자동으로 시작한다
# 여러 Spring 테스트 컨텍스트가 같은 컨테이너를 공유하도록 JVM 종료까지 유지한다
spring.datasource.url=jdbc:tc:mysql:8.0.36:///newslit_test?TC_DAEMON=true
spring.datasource.username=test
spring.datasource.password=test
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
# 컨테이너 자체가 폐기되므로 JVM 종료 훅에서 스키마를 다시 삭제하지 않는다
spring.jpa.hibernate.ddl-auto=create
# CLOB 컬럼을 LONGTEXT로 생성 (TestMySQLDialect 주석 참고)
spring.jpa.properties.hibernate.dialect=com.newslit.backend.support.TestMySQLDialect
