# Gemini Code Assist 설정 파일
review:
  # 엄격한 리뷰를 위해 낮은 단계의 이슈부터 모두 보고합니다.
  severity_threshold: "LOW"
  language: "ko"

  # 질문하신 우선순위를 모두 반영하여 분석 범위를 넓게 잡습니다.
  focus_areas:
    - "SECURITY"
    - "PERFORMANCE"
    - "READABILITY"
    - "TESTABILITY"
    - "MAINTAINABILITY"

automation:
  # PR 생성 시 변경 사항을 상세히 요약합니다.
  summary: true
  # 코드 라인마다 구체적인 수정 제안(Comment)을 남깁니다.
  comments: true

# 특정 파일 형식을 리뷰에서 제외하고 싶다면 아래를 활용하세요.
# ignore:
#   - "**/*.md"
#   - "**/dist/**"
